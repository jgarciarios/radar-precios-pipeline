x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    # LocalExecutor: corre las tareas como subprocesos del scheduler, en una sola
    # máquina. Para producción con muchos DAGs/tareas en paralelo se usaría
    # CeleryExecutor o KubernetesExecutor (workers separados, escalables), pero
    # eso suma Redis/Celery o un cluster de k8s. Para un portfolio con un DAG
    # chico, eso es complejidad que no se justifica todavía.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    # No necesitamos la DAG de ejemplos de Airflow ensuciando la UI.
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: "America/Argentina/Buenos_Aires"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Para que el DAG pueda hacer "from pipeline.stage import run_staging"
    # sin duplicar la lógica de pipeline/ (fase 2a) dentro del DAG.
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
    - ./pipeline:/opt/airflow/pipeline:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 5
    restart: always

  # Servicio de un solo disparo: crea/migra las tablas de metadata y el usuario
  # admin. No queda corriendo (restart: "no"); si falla, falla el "up" entero,
  # lo que es la señal correcta para no levantar webserver/scheduler sobre una
  # base de datos a medio migrar.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Juan \
          --lastname Garcia \
          --role Admin \
          --email juanignaciogarciarios@gmail.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db-volume:
