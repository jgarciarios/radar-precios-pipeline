version: 2

models:
  - name: stg_comercios
    description: >
      Una fila por (dt, id_comercio) - dedupeado de banderas. Pensado
      para joinear con stg_productos/mart_* por id_comercio (+ dt).
    columns:
      - name: comercio_id_dia
        description: Hash de (dt, id_comercio) - clave de esta tabla.
        data_tests:
          - unique
          - not_null
      - name: dt
        data_tests:
          - not_null
      - name: id_comercio
        data_tests:
          - not_null
      - name: comercio_razon_social
        data_tests:
          - not_null
